
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لیلی | افکار مریض من</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b12;
            color: #e8edf7;
            font-family: 'Vazirmatn', sans-serif;
            line-height: 2.3;
        }

        header {
            padding: 35px 20px;
            text-align: center;
            background: #0d1422;
            border-bottom: 1px solid #287BFF;
        }

        h1 {
            color: #287BFF;
            font-size: 36px;
            margin: 0;
        }

        .subtitle {
            color: #9aa8bd;
            margin-top: 8px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .chapter {
            background: #101827;
            border: 1px solid #1e3c68;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .chapter h2 {
            color: #287BFF;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .chapter-text {
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .chapter-text p {
            margin: 0 0 16px;
        }

        .status {
            text-align: center;
            color: #9aa8bd;
            padding: 30px 15px;
        }

        .error {
            color: #ff7777;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #287BFF;
            text-decoration: none;
        }

        a:hover {
            color: #70aaff;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #69778d;
            border-top: 1px solid #1b2b43;
        }

        @media (max-width: 600px) {
            main {
                padding: 12px;
                margin: 20px auto;
            }

            .chapter {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>لیلی</h1>
        <div class="subtitle">افکار مریض من</div>
    </header>

    <main>

        <div id="chapters" class="status">
            در حال بارگذاری داستان...
        </div>

        <a href="index.html">← بازگشت به صفحه اصلی</a>

    </main>

    <footer>
        افکار مریض من | جایی برای نوشته‌هایی از ذهن من
    </footer>

    <script>

        const chaptersContainer = document.getElementById("chapters");

        const API_URL =
            "https://api.github.com/repos/kiarashhatamy-hash/afkare-marize-man/contents/chapters?ref=main";

        // نمایش پیام
        function showMessage(message, isError = false) {
            chaptersContainer.className =
                isError ? "status error" : "status";

            chaptersContainer.textContent = message;
        }

        // جلوگیری از اجرای کدهای ناخواسته در متن
        function escapeHTML(text) {
            return String(text).replace(/[&<>"']/g, function(char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char];
            });
        }

        // اصلاح نام داستان و حذف کاراکترهای اضافی
        function normalizeStory(value) {
            return String(value || "")
                .replace(/\\[tnr]/gi, "")
                .replace(/[\s\u200c\u200e\u200f]/g, "")
                .replace(/[\u200b\ufeff]/g, "")
                .trim()
                .replace(/ي/g, "ی")
                .replace(/ك/g, "ک");
        }

        // خواندن اطلاعات ابتدای فایل Markdown
        function readMetadata(text) {
            const metadata = {};

            text.split(/\r?\n/).forEach(function(line) {

                const match = line.match(/^([a-zA-Z_]+):\s*(.*)$/);

                if (!match) return;

                let value = match[2].trim();

                if (
                    value.startsWith('"') &&
                    value.endsWith('"')
                ) {
                    value = value.slice(1, -1);
                }

                if (
                    value.startsWith("'") &&
                    value.endsWith("'")
                ) {
                    value = value.slice(1, -1);
                }

                metadata[match[1]] = value;
            });

            return metadata;
        }

        // تبدیل متن فصل به پاراگراف
        function renderText(text) {

            return String(text || "")
                .split(/\r?\n/)
                .map(function(line) {

                    if (!line.trim()) return "";

                    let safeLine = escapeHTML(line.trim());

                    safeLine = safeLine.replace(
                        /\*\*(.*?)\*\*/g,
                        "<strong>$1</strong>"
                    );

                    safeLine = safeLine.replace(
                        /\*(.*?)\*/g,
                        "<em>$1</em>"
                    );

                    return "<p>" + safeLine + "</p>";

                })
                .join("");
        }

        // دریافت فصل‌ها از گیت‌هاب
        async function loadChapters() {

            try {

                showMessage("در حال دریافت فصل‌های داستان...");

                const response = await fetch(API_URL, {
                    cache: "no-store",
                    headers: {
                        "Accept": "application/vnd.github+json"
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        "خطای گیت‌هاب: " + response.status
                    );
                }

                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error("پوشه فصل‌ها قابل خواندن نیست.");
                }

                const markdownFiles = files.filter(function(file) {
                    return file.type === "file" &&
                        /\.md$/i.test(file.name);
                });

                const chapters = [];

                for (const file of markdownFiles) {

                    const fileResponse = await fetch(file.download_url, {
                        cache: "no-store"
                    });

                    if (!fileResponse.ok) continue;

                    const content = await fileResponse.text();

                    const match = content.match(
                        /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
                    );

                    if (!match) continue;

                    const metadata = readMetadata(match[1]);

                    const storyName = normalizeStory(metadata.story);

                    const isPublished =
                        String(metadata.published)
                            .toLowerCase()
                            .trim() === "true";

                    chapters.push({

                        title: metadata.title || file.name.replace(/\.md$/i, ""),

                        story: storyName,

                        chapter: Number(metadata.chapter || 0),

                        published: isPublished,

                        body: match[2]

                    });
                }

                // فقط فصل‌های منتشرشده داستان لیلی
                const publishedChapters = chapters
                    .filter(function(chapter) {

                        return chapter.story === "لیلی" &&
                            chapter.published === true;

                    })
                    .sort(function(a, b) {

                        return a.chapter - b.chapter;

                    });

                if (publishedChapters.length === 0) {

                    showMessage(
                        "فصلی برای داستان لیلی پیدا نشد. تعداد فایل‌های بررسی‌شده: " +
                        markdownFiles.length
                    );

                    return;
                }

                // نمایش فصل‌ها
                chaptersContainer.className = "";

                chaptersContainer.innerHTML =
                    publishedChapters.map(function(chapter) {

                        return `
                            <section class="chapter">

                                <h2>
                                    ${escapeHTML(chapter.title)}
                                </h2>

                                <div class="chapter-text">
                                    ${renderText(chapter.body)}
                                </div>

                            </section>
                        `;

                    }).join("");

            } catch (error) {

                console.error("Leili error:", error);

                showMessage(
                    "خطا در بارگذاری داستان: " + error.message,
                    true
                );

            }
        }

        loadChapters();

    </script>

</body>
</html>

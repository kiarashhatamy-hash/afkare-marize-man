
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیلی | افکار مریض من</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: #e8edf7;
    font-family: 'Vazirmatn', sans-serif;
    line-height: 2.3;
}

header {
    padding: 35px 20px;
    text-align: center;
    background: #0d1422;
    border-bottom: 1px solid #287BFF;
}

h1 {
    color: #287BFF;
    font-size: 36px;
    margin: 0;
}

.subtitle {
    color: #9aa8bd;
    margin-top: 8px;
}

main {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.chapter {
    background: #101827;
    border: 1px solid #1e3c68;
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 25px;
}

.chapter h2 {
    color: #287BFF;
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

.chapter-text {
    font-size: 16px;
    overflow-wrap: anywhere;
}

.chapter-text p {
    margin: 0 0 16px;
}

.status {
    text-align: center;
    color: #9aa8bd;
    padding: 30px 15px;
}

.error {
    color: #ff7777;
}

a {
    display: inline-block;
    margin-top: 25px;
    color: #287BFF;
    text-decoration: none;
}

a:hover {
    color: #70aaff;
}

footer {
    text-align: center;
    padding: 25px;
    color: #69778d;
    border-top: 1px solid #1b2b43;
}
</style>
</head>

<body>

<header>
    <h1>لیلی</h1>
    <div class="subtitle">افکار مریض من</div>
</header>

<main>
    <div id="chapters" class="status">
        در حال بارگذاری داستان...
    </div>

    <a href="index.html">← بازگشت به صفحه اصلی</a>
</main>

<footer>
    افکار مریض من | جایی برای نوشته‌هایی از ذهن من
</footer>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script>
const chaptersContainer = document.getElementById("chapters");

const API_URL =
    "https://api.github.com/repos/kiarashhatamy-hash/afkare-marize-man/contents/chapters?ref=main";

marked.setOptions({
    breaks: true
});

function showMessage(message, isError = false) {
    chaptersContainer.className =
        isError ? "status error" : "status";

    chaptersContainer.textContent = message;
}

async function loadChapters() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("فهرست فصل‌ها دریافت نشد.");
        }

        const files = await response.json();

        const markdownFiles = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".md")
        );

        const allChapters = await Promise.all(
            markdownFiles.map(async file => {
                const fileResponse = await fetch(file.download_url);

                if (!fileResponse.ok) {
                    return null;
                }

                const markdown = await fileResponse.text();

                const match = markdown.match(
                    /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
                );

                if (!match) {
                    return null;
                }

                const metadata = jsyaml.load(match[1]) || {};
                const body = match[2];

                return {
                    title: metadata.title || file.name.replace(".md", ""),
                    story: metadata.story,
                    chapter: Number(metadata.chapter || 0),
                    published: metadata.published === true,
                    body: body
                };
            })
        );

        const publishedChapters = allChapters
            .filter(chapter =>
                chapter &&
                chapter.story === "لیلی" &&
                chapter.published === true
            )
            .sort((a, b) => a.chapter - b.chapter);

        if (publishedChapters.length === 0) {
            showMessage(
                "هنوز فصلی برای داستان لیلی منتشر نشده است."
            );
            return;
        }

        chaptersContainer.className = "";

        chaptersContainer.innerHTML = publishedChapters.map(chapter => `
            <section class="chapter">
                <h2>${escapeHTML(chapter.title)}</h2>
                <div class="chapter-text">
                    ${marked.parse(chapter.body || "")}
                </div>
            </section>
        `).join("");

    } catch (error) {
        console.error(error);

        showMessage(
            "بارگذاری فصل‌ها با مشکل مواجه شد. لطفاً کمی بعد دوباره امتحان کن.",
            true
        );
    }
}

function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

loadChapters();
</script>

</body>
</html>
